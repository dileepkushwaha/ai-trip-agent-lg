[project]
name = "ai-trip-agent"
version = "2.2.0"
description = "AI-powered travel planning assistant for Assam with carbon footprint tracking"

[tool.langchain]
# LangChain CLI configuration for the AI Trip Agent

[tool.langchain.serve]
# API serving configuration
host = "0.0.0.0"
port = 8001

[tool.langchain.templates]
# Custom templates directory
templates_dir = "agents"

[tool.langchain.chains]
# Available chains in the project
trip_planning = "agents.graph:create_agent_graph"
knowledge_retrieval = "agents.knowledge:KnowledgeAgent"
itinerary_generation = "agents.itinerary:ItineraryAgent"
carbon_calculation = "agents.carbon:CarbonAgent"
